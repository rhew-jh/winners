<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WINNERS — 정답 그림 연결 확인</title>
<script src="ans-img.js?v=3"></script>
<style>
  body{margin:0;padding:20px 14px 40px;background:#f4f8fe;color:#1b3b60;
       font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif}
  .wrap{max-width:560px;margin:0 auto}
  h1{font-size:19px;margin:0 0 6px;color:#15345d}
  p.sub{font-size:13px;color:#6e87a2;line-height:1.6;margin:0 0 16px}
  .card{background:#fff;border:1px solid #dbe7f5;border-radius:16px;padding:16px;margin-bottom:12px;
        box-shadow:0 8px 22px rgba(21,52,93,.06)}
  label{display:block;font-size:12.5px;font-weight:800;color:#42607f;margin:10px 0 4px}
  input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #cfdcec;border-radius:10px;font-size:15px}
  .row{display:flex;gap:8px}
  .row > div{flex:1}
  .card button{margin-top:14px;width:100%;padding:13px;border:0;border-radius:12px;background:#1a70d6;color:#fff;
         font-size:15px;font-weight:900;cursor:pointer}
  .card button.ghost{background:#e8f5f3;color:#1d7d70;margin-top:8px}
  pre{background:#0f1c2b;color:#cfe3f7;border-radius:10px;padding:12px;font-size:12px;overflow:auto;margin:10px 0 0}
  table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
  td,th{border-bottom:1px solid #e7eef7;padding:6px 4px;text-align:left}
  th{color:#6e87a2;font-weight:800}
</style>
</head>
<body>
<div class="wrap">
  <h1>🖼 정답 그림 연결 확인</h1>
  <p class="sub">빠른정답의 <b>(그림)</b> 칩이 어떤 파일을 여는지 눈으로 확인하는 화면입니다.
     교재ID를 모르면 <b>교재명</b>만 넣어도 됩니다(별칭표로 찾습니다).</p>

  <div class="card">
    <label>교재ID (예: 중2-2/올백_중2-2_기말 · 비워도 됨)</label>
    <input id="bookId" placeholder="교재ID">
    <label>교재명 (예: 쎈 5-2 정답)</label>
    <input id="title" placeholder="교재명">
    <div class="row">
      <div><label>쪽</label><input id="page" inputmode="numeric" placeholder="2"></div>
      <div><label>문항</label><input id="no" inputmode="numeric" placeholder="1"></div>
    </div>
    <button id="go">정답 그림 열기</button>
    <button id="pv" class="ghost">경로만 확인</button>
    <pre id="out">—</pre>
  </div>

  <div class="card">
    <label style="margin-top:0">등록된 그림 교재</label>
    <table id="books"><tbody><tr><td>불러오는 중…</td></tr></tbody></table>
  </div>
</div>

<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  function out(o) { $('out').textContent = typeof o === 'string' ? o : JSON.stringify(o, null, 2); }

  function run(openIt) {
    var id = $('bookId').value.trim(), t = $('title').value.trim();
    var pg = $('page').value.trim(), no = $('no').value.trim();
    if (!pg || !no) { out('쪽과 문항 번호를 넣어 주세요.'); return; }
    WINNERS_ANSIMG.loadManifest().then(function () {
      var r = WINNERS_ANSIMG.resolve(id, pg, no, t);
      out({
        입력: { 교재ID: id || '(없음)', 교재명: t || '(없음)', 쪽: pg, 문항: no },
        찾은폴더: r.alias || '(없음)',
        경로출처: r.basis,
        이미지경로: r.src
      });
      if (openIt) WINNERS_ANSIMG.open(id, pg, no, t);
    });
  }

  $('go').onclick = function () { run(true); };
  $('pv').onclick = function () { run(false); };

  WINNERS_ANSIMG.loadManifest().then(function () {
    var man = WINNERS_ANSIMG.last ? null : null;
    fetch('ans_img/manifest.json', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        var body = $('books').tBodies[0];
        body.innerHTML = '';
        var meta = (j && j.meta) || {};
        var books = meta.books || {};
        var keys = Object.keys(books);
        if (!keys.length) { body.innerHTML = '<tr><td>매니페스트를 읽지 못했습니다.</td></tr>'; return; }
        var n = 0;
        keys.forEach(function (k) {
          var b = books[k]; n += b.images || 0;
          var tr = document.createElement('tr');
          tr.innerHTML = '<th>' + k + '</th><td>' + (b.name || '') + '</td><td>' + (b.images || 0) + '장</td>';
          body.appendChild(tr);
        });
        var tr = document.createElement('tr');
        tr.innerHTML = '<th>합계</th><td>' + keys.length + '권 · 쪽 기준: ' + (meta.pageBasis || '?') + '</td><td>' + n + '장</td>';
        body.appendChild(tr);
      });
  });
})();
</script>
</body>
</html>
