<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script>window.WINNERS_BRIDGE={mode:"math",exec:"https://script.google.com/macros/s/AKfycbzATgaIbUsl8wOCJVe2Sn4K2HyzX6UGVZIbFBwtyyXpt2A4fvlwBeivcQS1Bzrzc6eK/exec"};</script>
<script src="bridge.js?v=8"></script>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WINNERS 수학 채점 · 원장 화면</title>
<style>
  :root{--navy:#16306b;--ink:#1b2440;--muted:#6b7785;--line:#e3e8f1;--bg:#f2f5fb;--soft:#eef2fb;--red:#c8102e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
  header b{font-size:16px}
  header .who{margin-left:auto;font-size:11.5px;background:rgba(255,255,255,.17);padding:5px 9px;border-radius:20px}
  main{padding:14px;max-width:960px;margin:0 auto}
  .card{background:#fff;border-radius:14px;padding:15px;margin-bottom:12px;box-shadow:0 2px 10px rgba(16,32,64,.06)}
  .card h2{font-size:14px;margin:0 0 10px;color:var(--navy)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{padding:7px 6px;border-bottom:1px solid #eef1f6;text-align:left}
  th{color:var(--muted);font-weight:700;font-size:11.5px}
  input{padding:9px 10px;border:1.5px solid var(--line);border-radius:9px;font-size:13.5px;width:100%}
  button{font-family:inherit;font-size:13px;padding:10px 13px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:800}
  button.primary{background:var(--navy);border-color:var(--navy);color:#fff;width:100%}
  button.mini{padding:6px 9px;font-size:12px}
  .note{font-size:12.5px;line-height:1.6;border-radius:10px;padding:10px;margin-top:10px;background:#f1f4f9}
  .note.err{background:#fdecec;color:#8c1d18}.note.ok{background:#eaf7ee;color:#125c33}
  .hide{display:none!important}
  .row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 150px}
  .tag{font-size:11px;background:var(--soft);color:var(--navy);border-radius:20px;padding:2px 8px;font-weight:800}
  .tag.hard{background:#fff0ec;color:#b3261e}
  code{background:#f3f5f9;padding:1px 5px;border-radius:5px;font-size:12px}
</style>
</head>
<body>
<header><b>수학 채점 · 원장 화면</b><span class="who hide" id="who">관리자</span></header>
<main>
  <div class="card" id="loginCard">
    <h2>관리자 토큰</h2>
    <input type="password" id="token" placeholder="관리자 토큰">
    <div style="margin-top:10px"><button class="primary" id="loginBtn">열기</button></div>
    <div class="note hide" id="loginMsg"></div>
  </div>

  <div id="app" class="hide">
    <div class="card">
      <h2>수학 선생님 5명 (이름·핀 수정)</h2>
      <table><thead><tr><th>슬롯</th><th>이름</th><th>핀</th><th>사용</th><th></th></tr></thead>
      <tbody id="teachers"></tbody></table>
      <div class="note">핀을 바꾸면 그 선생님 폰은 다음 접속 때 새 핀을 넣어야 합니다(즉시 적용).</div>
      <div class="note hide" id="tMsg"></div>
    </div>

    <div class="card">
      <h2>배포된 시험지</h2>
      <table><thead><tr><th>코드</th><th>제목</th><th>문항</th><th>해설</th><th>만든 날</th></tr></thead>
      <tbody id="exams"></tbody></table>
    </div>

    <div class="card">
      <h2>최근 채점 기록</h2>
      <table><thead><tr><th>시각</th><th>선생님</th><th>학생</th><th>점수</th><th>오답</th><th>시험지</th></tr></thead>
      <tbody id="grades"></tbody></table>
    </div>

    <div class="card">
      <h2>관리자 토큰 바꾸기</h2>
      <div class="row"><input type="password" id="newToken" placeholder="새 토큰 (6자 이상)">
        <button class="mini" id="chgBtn">바꾸기</button></div>
      <div class="note">바꾸면 이 기기에 저장된 토큰도 즉시 무효가 되어 다시 넣어야 합니다.</div>
      <div class="note hide" id="chgMsg"></div>
    </div>
  </div>
</main>
<script>
const $=s=>document.querySelector(s);
const LS='wmath_admin_v1';
let TOKEN='';
function saved(){try{return JSON.parse(localStorage.getItem(LS)||'null')}catch(e){return null}}
function gs(payload){return new Promise((res,rej)=>{if(!window.google||!google.script||!google.script.run){res({ok:false,code:'NORUN',error:'앱 연결을 확인해 주세요.'});return;}google.script.run.withSuccessHandler(res).withFailureHandler(rej).apiCall(payload);});}
function api(q){const o={}; q.split('&').forEach(kv=>{const [k,v]=kv.split('='); o[decodeURIComponent(k)]=decodeURIComponent(v||'');}); return gs(o);}
function post(o){return gs(o);}
function msg(id,t,c){const e=$(id);e.textContent=t;e.className='note'+(c?' '+c:'');e.classList.remove('hide');}

async function login(){
  TOKEN=$('#token').value.trim();
  const d=await gs({api:'exams', token:TOKEN});
  if(!d.ok){ msg('#loginMsg', d.code==='ADMIN'?'토큰이 맞지 않습니다.':(d.error||'실패'),'err'); return; }
  localStorage.setItem(LS,JSON.stringify({token:TOKEN}));
  $('#loginCard').classList.add('hide'); $('#app').classList.remove('hide'); $('#who').classList.remove('hide');
  paintExams(d.exams||[]); loadTeachers(); loadGrades();
}
async function loadTeachers(){
  const d=await gs({api:'teachers', token:TOKEN});
  if(!d.ok) return;
  const tb=$('#teachers'); tb.innerHTML='';
  d.teachers.forEach(t=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td><b>${t.slot}</b></td>
      <td><input value="${t.name}" data-k="name"></td>
      <td><input value="${t.pin}" data-k="pin" style="width:90px"></td>
      <td><select data-k="active"><option value="Y"${t.active?' selected':''}>사용</option>
        <option value="N"${t.active?'':' selected'}>정지</option></select></td>
      <td><button class="mini">저장</button></td>`;
    tr.querySelector('button').onclick=async ()=>{
      const g=k=>tr.querySelector(`[data-k="${k}"]`).value;
      const r=await post({api:'setTeacher',token:TOKEN,slot:t.slot,name:g('name'),pin:g('pin'),active:g('active')});
      msg('#tMsg', r.ok?`${t.slot} 저장했습니다.`:(r.error||'실패'), r.ok?'ok':'err');
    };
    tb.appendChild(tr);
  });
}
function paintExams(list){
  const tb=$('#exams'); tb.innerHTML='';
  if(!list.length){ tb.innerHTML='<tr><td colspan="5" style="color:#6b7785">아직 배포한 시험지가 없습니다. 콘솔에서 PDF를 만들면 자동으로 올라갑니다.</td></tr>'; return; }
  list.forEach(x=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td><code>${x.code}</code></td><td>${x.title}${x.kind?' <span class="tag hard">'+x.kind+'</span>':''}</td>
      <td>${x.items}</td><td>${x.sol||0}</td><td>${String(x.created).slice(0,16).replace('T',' ')}</td>`;
    tb.appendChild(tr);
  });
}
async function loadGrades(){
  const d=await gs({api:'grades', token:TOKEN});
  if(!d.ok) return;
  const tb=$('#grades'); tb.innerHTML='';
  (d.rows||[]).forEach(x=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${String(x.when).slice(0,16).replace('T',' ')}</td><td>${x.teacher}</td><td>${x.student}</td>
      <td><b>${x.score}</b></td><td>${x.wrongNos||'-'}</td><td>${x.title}</td>`;
    tb.appendChild(tr);
  });
}
$('#loginBtn').onclick=login;
$('#token').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
$('#chgBtn').onclick=async ()=>{
  const nt=$('#newToken').value.trim();
  if(nt.length<6){ msg('#chgMsg','6자 이상으로 정해 주세요.','err'); return; }
  const r=await post({api:'setToken',token:TOKEN,newToken:nt});
  if(r.ok){ localStorage.removeItem(LS); msg('#chgMsg','토큰을 바꿨습니다. 새 토큰으로 다시 열어 주세요.','ok'); TOKEN=''; }
  else msg('#chgMsg', r.error||'실패','err');
};
(function boot(){
  const s=saved();
  if(s&&s.token){ TOKEN=s.token; $('#token').value=s.token;
    gs({api:'exams', token:TOKEN}).then(d=>{
      if(d.ok){ $('#loginCard').classList.add('hide'); $('#app').classList.remove('hide');
        $('#who').classList.remove('hide'); paintExams(d.exams||[]); loadTeachers(); loadGrades(); }
      else { localStorage.removeItem(LS); msg('#loginMsg','저장된 토큰이 더 이상 유효하지 않습니다. 새 토큰을 넣어 주세요.','err'); }
    });
  }
})();
</script>
</body>
</html>
