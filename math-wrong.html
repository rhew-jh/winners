<!doctype html><html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WINNERS 수학 선생님</title>
<script>window.WINNERS_BRIDGE={mode:"gas",exec:"https://script.google.com/macros/s/AKfycbymRr0dMKGbCob4w9LyNR08N2RbmfyK4xxXrgt2SgcZan9daWbro64jG_NP3GVvpRK3sg/exec"};</script>
<script src="bridge.js?v=8"></script>
<script src="photo-upload.js?v=6"></script>
<script src="ans-img.js?v=3"></script>
<style>
:root{
  /* 2026-11-28 UI 4번 — 블루 & 오렌지 */
  --teal:#f2711c; --teal2:#fff1e6; --ink:#1d2b3a; --mut:#6f8093; --line:#dce5ef;
  --navy:#12447e; --blue:#1f6fd0; --red:#e2543a; --amber:#c2410c;
}
*{box-sizing:border-box;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:#f2f6fc;color:var(--ink);
  font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif}
body{padding:12px}
a{color:#1769bd}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
.hide{display:none!important}
.wb{max-width:1240px;margin:0 auto}

/* 로그인 */
.wb-login{display:flex;justify-content:center;padding:9vh 8px 40px}
.wb-login-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;width:min(400px,100%);
  box-shadow:0 10px 30px rgba(20,40,70,.08)}
.wb-login-tt{font-size:20px;font-weight:800;color:var(--navy)}
.wb-login-sub{font-size:14px;color:var(--mut);margin:6px 0 14px;line-height:1.5}
.wb-pin{width:100%;font-size:26px;letter-spacing:.5em;text-align:center;padding:12px;border:2px solid #cdd9e6;
  border-radius:12px;font-weight:800}
.wb-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.wb-key{min-height:56px;font-size:20px;font-weight:800;border:1px solid #d3e0ec;background:#f7fafd;color:var(--navy);
  border-radius:12px}
.wb-key.del{font-size:15px}
.wb-key.ok{font-size:15px;background:var(--teal2);border-color:#bfe0da;color:#1d7d70}
.wb-key:active{background:#e6eef7}
.wb-enter{width:100%;min-height:48px;font-size:16px}
.wb-status{font-size:13.5px;color:var(--mut);margin:8px 2px;line-height:1.5;min-height:18px}
.wb-status.err{color:var(--amber)}
.wb-split{display:flex;align-items:center;gap:10px;margin:16px 0 12px;color:#9aa9b8;font-size:12px;font-weight:800}
.wb-split::before,.wb-split::after{content:'';flex:1;height:1px;background:var(--line)}
.wb-alt{display:block;width:100%;min-height:46px;font-size:14.5px;font-weight:800;border-radius:12px;
  border:1px solid #cfe0d9;background:var(--teal2);color:#1d7d70;margin-top:8px}
.wb-alt.grey{background:#f3f6fa;border-color:#dbe3ec;color:#41586e}

/* 상단 */
.wb-bar{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:9px 14px;margin-bottom:8px;position:sticky;top:0;z-index:40}
.wb-date{font-size:17px;font-weight:900;color:var(--navy);letter-spacing:-.02em}
.wb-who{margin-left:auto;font-size:13.5px;font-weight:800;color:#125f8c}
.wb-mini{min-height:32px;padding:0 10px;font-size:12.5px;border-radius:9px;border:1px solid #d3e0ec;
  background:#eef4f8;color:#2d5470;font-weight:800}

/* 탭 */
.wb-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.wb-tab{min-height:44px;padding:0 15px;border-radius:12px;border:1px solid #d3e0ec;background:#fff;color:#2d5470;
  font-weight:900;font-size:14px}
.wb-tab.on{background:#174777;border-color:#174777;color:#fff}
.wb-tab small{display:block;font-size:10.5px;font-weight:700;opacity:.75;margin-top:-2px}
.wb-tab.admin{border-color:#f0c9a8;background:#fff7ef;color:#b45309}
.wb-tab.admin.on{background:#b45309;border-color:#b45309;color:#fff}

/* 고르기 */
.wb-pick{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.wb-chips{display:flex;gap:6px;flex-wrap:wrap}
.wb-chip{min-height:38px;padding:0 13px;border-radius:999px;border:1px solid #d3e0ec;background:#fff;color:#2d5470;
  font-weight:800;font-size:14px}
.wb-chip.on{background:#174777;border-color:#174777;color:#fff}
.wb-chip small{font-weight:700;opacity:.7;margin-left:4px;font-size:11.5px}
.wb-book select{width:100%;min-height:44px;border:1px solid #cdd9e6;border-radius:11px;padding:6px 10px;
  font-size:15px;background:#fff;color:inherit;font-weight:800}

/* 숙제여부·수행력 */
.wb-meta{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:8px;
  display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.wb-meta-row{display:flex;align-items:center;gap:8px}
.wb-meta-lb{font-size:13.5px;font-weight:800;color:#31536f;white-space:nowrap}
.wb-range{width:min(300px,46vw);accent-color:var(--teal);height:28px}
.wb-und{font-size:14px;font-weight:900;color:var(--teal);min-width:44px}

/* 채점범위 */
.wb-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;background:#fff;
  border:1px solid var(--line);border-radius:14px}
.wb-lbl{font-weight:800;font-size:14px}
.wb-num{width:64px;min-height:38px;text-align:center;font-size:16px;font-weight:800;border:1px solid #cdd9e6;
  border-radius:9px;padding:4px 6px;background:#fff;color:inherit}
.wb-btn2{min-height:38px;padding:0 14px;border-radius:9px;border:0;background:var(--teal);color:#fff;
  font-weight:800;font-size:14px}
.wb-btn2.ghost{background:#eef4f8;color:#2d5470;border:1px solid #d3e0ec}
.wb-btn2.print{background:#16406b;margin-left:auto}
.wb-hide{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;color:#31536f;white-space:nowrap}
.wb-hide input{width:19px;height:19px;accent-color:var(--teal)}

/* ── 2차(2026-11-28): 좌우 2분할을 없애고 1열 한 화면 ──
   쪽마다 [빠른 정답](크고 넓게) → 바로 아래 [O/X 문항] 순서로 세로로 쌓는다.
   세로로 쭉 내려 보며 채점할 수 있게 위아래 여백을 넉넉히 둔다. */
.wb-mx{display:block;margin-top:6px;background:#fff;border:1px solid var(--line);
  border-radius:14px;overflow:hidden}
/* 쪽 행 위의 작은 머리글은 1열에서 필요 없다(쪽 이름은 각 줄이 스스로 보여 준다) */
.wb-mh{display:none}
.wb-mu{background:#12447e;color:#fff;font-weight:900;font-size:14px;padding:9px 15px;letter-spacing:-.01em}
.wb-mq{display:flex;align-items:flex-start;gap:11px;padding:13px 15px 12px;background:#eef6ff;
  border-top:1px solid #dbe8f8;min-width:0;flex-wrap:wrap}
.wb-mq a{flex:0 0 auto;font-weight:900;font-size:17px;color:#0f3f74;text-decoration:none;
  background:#fff;border:1.5px solid #c9dcf0;border-radius:10px;padding:6px 12px;min-width:64px;
  text-align:center;line-height:1.25}
.wb-q-nos{display:flex;flex-wrap:wrap;gap:8px;flex:1 1 auto;min-width:0}
.wb-q{display:inline-flex;align-items:baseline;gap:5px;background:#fff;border:1.5px solid #cfdfef;
  border-radius:10px;padding:6px 11px;font-size:18px;font-weight:900;color:#123a63;line-height:1.25}
.wb-q b{font-size:12.5px;color:#6d8dab;font-weight:900}
.wb-q.none{background:#f7fafc;border-color:#e7eef5;color:#b3bec9}
.wb-mq.cont{background:#f7fbff;padding:7px 15px;color:#6d8dab;font-size:13px;font-weight:800;
  border-top:1px dashed #dbe8f8}
.wb-mr{display:flex;align-items:center;gap:10px;padding:11px 15px 13px;border-bottom:1px solid #e9eff6;
  min-width:0;flex-wrap:wrap}
.wb-mr.done{background:#f6fbf8}
/* 빠른정답 쪽 번호를 누르면 그 줄로 이동 + 잠깐 노란 표시 */
.wb-mr.flash{background:#fff6cf !important;box-shadow:inset 0 0 0 2px #eab308;transition:background .25s}
.wb-pg{flex:0 0 64px;font-weight:900;font-size:17px;color:#123a63;display:flex;
  flex-direction:column;gap:3px;align-items:flex-start}
.wb-pg .st{font-size:11px;font-weight:900;color:#1d7d70;background:#e8f5f3;border-radius:6px;padding:1px 5px}
.wb-pg .st.stu{color:#8a4b00;background:#fff1e0}
.wb-nos{display:flex;flex-wrap:wrap;gap:9px 3px;flex:1 1 260px;min-width:0}
.wb-o{position:relative;width:52px;min-height:64px;border:0;background:transparent;padding:0 0 2px;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;color:#7b8a9a;cursor:pointer}
.wb-o .n{font-size:13px;font-weight:900;line-height:1.3;color:#6f8296}
.wb-o .c{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;
  border:3px solid var(--teal);color:var(--teal);font-size:20px;font-weight:900;line-height:1;background:#fff}
.wb-o.on .n{color:var(--amber)}
.wb-o.on .c{border-color:var(--red);color:var(--red);background:#fdecea}
.wb-att{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:4px;min-width:124px}
.wb-att button{font-family:inherit;min-height:29px;font-size:11.5px;font-weight:900;padding:3px 2px;border-radius:8px;
  border:1px solid #d8e2ec;background:#fff;color:#5b7c96;line-height:1.1}
.wb-att button.on{background:#fff3e8;border-color:#f0c9a8;color:#b45309}
.wb-att button[data-k="check"].on{background:#fdecea;border-color:#f0b4ab;color:#b3261e}
.wb-sc{flex:0 0 54px;text-align:center;font-weight:900;font-size:14px;color:#5b7c96}
.wb-sc.warn{color:var(--amber)}
.wb-sv{flex:0 0 auto}
.wb-save{flex:0 0 auto;min-width:78px;min-height:46px;border-radius:10px;border:1px solid #cfe0d9;background:var(--teal2);
  color:#1d7d70;font-weight:900;font-size:14px;white-space:nowrap}
.wb-save:disabled{opacity:.6}
.wb-save.ok{background:#1d7d70;border-color:#1d7d70;color:#fff}
.wb-empty{padding:26px 12px;text-align:center;color:var(--mut);font-size:13.5px;line-height:1.7;white-space:pre-line}
.wb-mx .wb-empty{grid-column:1 / -1}

/* 카드(코멘트·출제·배정·원장) */
.wb-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-top:8px}
.wb-h2{font-size:14.5px;font-weight:900;color:var(--navy);margin:0 0 9px;display:flex;align-items:center;gap:8px}
.wb-h2 .tag{font-size:11px;font-weight:800;background:var(--teal2);color:#1d7d70;border-radius:20px;padding:2px 8px}
.wb-in{width:100%;min-height:42px;border:1px solid #cdd9e6;border-radius:10px;padding:8px 10px;font-size:14.5px;
  font-weight:700;font-family:inherit;background:#fff;color:inherit}
.wb-ta{width:100%;min-height:96px;border:1px solid #cdd9e6;border-radius:10px;padding:9px 10px;font-size:14.5px;
  font-family:inherit;line-height:1.55;resize:vertical;background:#fff;color:inherit}
.wb-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.wb-row>*{flex:0 1 auto}
.wb-row .grow{flex:1 1 200px}
.wb-f{display:flex;flex-direction:column;gap:4px;flex:1 1 120px;min-width:96px}
.wb-f span{font-size:12px;font-weight:800;color:#4a6a86}
.wb-list{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.wb-item{border:1px solid #eef2f7;border-radius:11px;padding:8px 10px;background:#fbfdfe;font-size:13px;line-height:1.5}
.wb-item b{color:var(--navy)}
.wb-item .mut{color:var(--mut);font-size:12px}
.wb-item .txt{white-space:pre-wrap;margin-top:4px;font-size:13.5px;color:#23384d}
.wb-pgsel{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.wb-ck{display:inline-flex;align-items:center;gap:4px;border:1px solid #dbe6ef;background:#fff;border-radius:8px;
  padding:3px 7px;font-size:12.5px;font-weight:800;color:#31536f}
.wb-ck input{width:16px;height:16px;accent-color:var(--teal)}
.wb-ck.on{background:#fdecea;border-color:#f0b4ab;color:#b3261e}
.wb-note{font-size:12.5px;line-height:1.6;border-radius:10px;padding:9px 11px;margin-top:8px;background:#f4f7fb;color:#41607c}
.wb-note.ok{background:#eaf7ee;color:#125c33}
.wb-note.err{background:#fdecec;color:#8c1d18}
.wb-tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
.wb-tbl th,.wb-tbl td{border-bottom:1px solid #eef2f7;padding:6px 5px;text-align:left;vertical-align:top}
.wb-tbl th{color:#4a6a86;font-size:11.5px;font-weight:900;background:#f6f9fc}
.wb-gchips{display:flex;flex-wrap:wrap;gap:3px;max-width:430px}
.wb-gc{min-height:28px;padding:0 7px;border-radius:7px;border:1px solid #d8e2ec;background:#fff;color:#5b7c96;
  font-size:11.5px;font-weight:800}
.wb-gc.on{background:#174777;border-color:#174777;color:#fff}
.wb-bar-b{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.wb-count{margin-left:auto;font-size:13px;font-weight:900;color:#125f8c}

/* 인쇄 요청 창 */
.wb-modal{position:fixed;inset:0;background:#0b1220b8;display:flex;align-items:center;justify-content:center;padding:14px;z-index:60}
.wb-modal-box{background:#fff;border-radius:16px;padding:18px;width:min(460px,100%)}
.wb-modal-tt{font-size:18px;font-weight:900;color:var(--navy)}
.wb-modal-sub{font-size:13px;color:var(--mut);margin:6px 0 10px;line-height:1.5}
.wb-modal-row{display:flex;align-items:center;gap:8px;margin:8px 0}
.wb-modal-in{flex:1;min-height:42px;border:1px solid #cdd9e6;border-radius:10px;padding:8px 10px;font-size:15px;font-weight:800}
.wb-modal-foot{display:flex;gap:8px;margin-top:14px}
.wb-modal-foot>*{flex:1;min-height:46px;font-size:15px}

/* 학생 화면 */
.wb-stu-hd{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.wb-stu-tt{font-size:18px;font-weight:900;color:var(--navy)}
.wb-stu-sub{font-size:13px;color:var(--mut);margin-top:4px;line-height:1.5}
.wb-stu-who{display:inline-block;margin-top:9px;padding:7px 14px;border-radius:999px;background:#e8f5f3;
  border:1px solid #bfe0da;color:#1d7d70;font-size:15px;font-weight:900;letter-spacing:-.01em}
.wb-stu-who.hide{display:none}
.wb-stu .wb-mx{grid-template-columns:1fr}
.wb-stu .wb-mh.q,.wb-stu .wb-mq{display:none}

/* 좁은 노트북·태블릿: 1열은 그대로 두고 글씨만 살짝 줄인다(태블릿에서도 크게 보이도록) */
@media (max-width:1100px){
  .wb-q{font-size:17px;padding:5px 10px}
  .wb-o{width:48px}
  .wb-o .c{width:35px;height:35px;font-size:18px}
}

/* 768 안팍 태블릿 세로 */
@media (max-width:820px){
  .wb-q{font-size:16.5px}
  .wb-mq a{font-size:16px;min-width:58px}
  .wb-o{width:46px;min-height:60px}
  .wb-o .c{width:33px;height:33px;font-size:17px}
  .wb-pg{flex:0 0 58px;font-size:16px}
}

/* 그보다 좁은 화면 */
@media (max-width:760px){  body{padding:8px}
  .wb-mq{padding:11px 12px 10px;gap:9px}
  .wb-q{font-size:16px;padding:5px 9px}
  .wb-q b{font-size:11.5px}
  .wb-o{width:44px;min-height:58px}
  .wb-o .c{width:32px;height:32px;font-size:16px;border-width:2.5px}
  .wb-o .n{font-size:12px}
  .wb-att{min-width:110px}
  .wb-pg{flex:0 0 52px;font-size:15px}
  .wb-save{min-width:66px;font-size:13px}
  .wb-sc{flex:0 0 46px;font-size:13px}
  .wb-date{font-size:15.5px}
  .wb-btn2.print{margin-left:0;width:100%}
  .wb-tab{padding:0 11px;font-size:13px}
}

/* 폰(390px 안팍): 페이지 줄을 카드로 — 문항 동그라미가 여러 개 가로로 */
@media (max-width:520px){
  body{padding:6px}
  .wb{max-width:none}
  .wb-bar{padding:7px 9px;gap:6px;flex-wrap:wrap}
  .wb-date{font-size:14.5px}
  .wb-who{font-size:12px;margin-left:0}
  .wb-mini{min-height:29px;font-size:11.5px;padding:0 8px}
  .wb-tabs{gap:5px}
  .wb-tab{min-height:36px;padding:0 9px;font-size:12px;border-radius:10px}
  .wb-tab small{display:none}
  .wb-chip{min-height:34px;padding:0 10px;font-size:13px}
  .wb-meta{padding:8px 10px;gap:6px 12px}
  .wb-range{width:150px}
  .wb-top{padding:8px 9px;gap:6px}
  .wb-num{width:64px;min-height:34px;font-size:14.5px;padding:4px 3px}
  .wb-btn2{min-height:34px;padding:0 11px;font-size:13px}
  /* 1열 유지 — 폰에서도 빠른정답·O/X가 한눈에 보이는 크기 */
  .wb-mu{border-radius:8px;margin:8px 0 5px;padding:6px 10px;font-size:12.5px}
  .wb-mq{gap:8px;padding:10px 10px 9px;background:#eef6ff;border:1px solid #dbe8f8;
    border-bottom:0;border-radius:10px 10px 0 0}
  .wb-mq a{font-size:15px;min-width:54px;padding:5px 9px}
  .wb-q{padding:5px 8px;font-size:16px;gap:4px}
  .wb-q b{font-size:11px}
  .wb-mr{flex-wrap:wrap;align-items:center;gap:7px 6px;padding:9px 10px 10px;background:#fff;
    border:1px solid #e6edf4;border-radius:0 0 10px 10px;margin:0 0 9px;border-top:0}
  .wb-mr.done{background:#f6fbf9}
  .wb-pg{flex:0 0 50px;font-size:15px}
  .wb-pg .st{font-size:10px}
  .wb-nos{flex:1 1 auto;width:calc(100% - 58px);min-width:0;gap:8px 2px}
  .wb-o{width:44px;min-height:58px}
  .wb-o .n{font-size:12px;line-height:1.2}
  .wb-o .c{width:32px;height:32px;font-size:16px;border-width:2.5px}
  /* 둘째 줄: 태도(2×2) · 점수 · 저장 */
  .wb-att{flex:1 1 0;grid-template-columns:repeat(2,1fr);gap:3px;max-width:170px;min-width:120px}
  .wb-att button{min-height:30px;font-size:11px;border-radius:7px;padding:0 2px}
  .wb-sc{flex:0 0 44px;font-size:13px}
  .wb-sv{flex:0 0 auto}
  .wb-save{min-height:42px;font-size:13px;padding:0 8px;border-radius:9px}
  .wb-stu .wb-att{display:none}
  .wb-card{padding:11px}
  .wb-ta{min-height:78px}
  .wb-list .wb-item{font-size:12.5px}
  /* L1(2026-11-28): 폰에서 누를 것을 크게 — 44px 기준에 가깝게 */
  .wb-tab{min-height:44px;font-size:13px}
  .wb-chip{min-height:42px}
  .wb-mini{min-height:38px;font-size:12.5px}
  .wb-hwq{min-height:32px;font-size:13px;padding:0 7px}
  .wb-logo{height:28px}
}

/* ── 2026-11-28 추가: 로고 · 로딩 가림 · 코너 칩 · 원클릭 숙제 · 답안지 화면 ── */

    function curTabKey() {
      var q = String(global.location ? global.location.search : '');
      if (/[?&]mode=one/.test(q)) return 'one:' + qpX('sid') + ':' + qpX('book');
      if (/[?&]mode=answers/.test(q)) return 'ans:' + qpX('bid');
      if (/[?&]mode=paper/.test(q)) return 'paper:' + qpX('sid') + ':' + qpX('prid');
      return 'teacher';
    }
    function qpX(name) {
      var m = new RegExp('[?&]' + name + '=([^&]+)').exec(String(global.location ? global.location.search : ''));
      return m ? decodeURIComponent(m[1]) : '';
    }
    function tabAdd(k, label, href) {
      if (!k) return;

    function newPicker(opt) {

      function paintGrades() {

          if (!seen[g]) { seen[g] = 0; list.push(g); }

        list.sort(function (a, b) { return gradeOrder(a) - gradeOrder(b) || a.localeCompare(b); });

          var b = btn('wb-chip' + (P.grade === g ? ' on' : ''));

          b.appendChild(el('small', '', String(seen[g])));

               전에는 같은 칩을 다시 눌러도 학생·교재가 초기화돼 표가 사라졌다. */
            if (P.grade === g) return;
            P.grade = g;
            if (!opt.multi) P.student = null;
            paintGrades(); paintStudents();
            probeGrade();
            if (opt.onGrade) opt.onGrade(g);
          };
          gc.appendChild(b);
        });
        if (!list.length) gc.appendChild(el('span', 'wb-status', '볼 수 있는 학생이 없습니다. 원장님께 공개 범위를 확인해 주세요.'));

      function gradeStudents(g) {
        return S.students.filter(function (s) { return g === 'all' || (s.grade || '미등록') === g; });
      }
      /* 오늘 채점 상태를 미리 받아 둔다(✓ 표시·필터·TOP3에 함께 쓴다) */
      function probeGrade() {
        var ids = gradeStudents(P.grade).map(function (s) { return s.id; });
        probeList(ids, function () { paintStudents(); });
      }
      function paintStudents() {
        sc.innerHTML = '';
        if (!P.grade) { if (opt.hint) sc.appendChild(el('span', 'wb-status', opt.hint)); return; }
        if (P.onlyBtn) P.onlyBtn.classList.toggle('on', !!P.only);
        var list = gradeStudents(P.grade);
        if (P.only) {
          var focus = [], rest = [];
          list.forEach(function (s) {
            var st = statOf(s.id);
            if (!st || !st.done || st.check) focus.push(s); else rest.push(s);
          });
          list = focus.concat(rest);
        }
        /* 2026-11-28: 학생을 고르면 명단을 접어 문항 격자가 바로 보이게 한다(폰에서 특히) */
        var collapsed = !!(P.student && !P.expand && !opt.multi);
        if (collapsed) {

          sc.appendChild(open);
          list = [P.student];
        }
        list.forEach(function (s) {
          var on = opt.multi ? !!P.students[s.id] : (P.student && P.student.id === s.id);

          var hwMark = (HW_TODAY[s.id] || {}).mark || '';

          var b = btn('wb-chip' + (on ? ' on' : '') + (st && st.done ? ' ok' : ''));

              paintStudents();
              if (opt.onStudents) opt.onStudents();
            } else {

              P.expand = false;
              paintStudents();
              if (opt.onStudent) opt.onStudent(s);
              if (opt.newTab) openStudentTab(s);   /* 2026-11-28: 학생별 새 탭(탭 이름 = 학생 이름) */
            }

          row.appendChild(b);
          /* 숙제 제출/미제출 원클릭 — 다시 누르면 해제 */
          if (opt.hw && !opt.multi) {
            [['O', '○', 'o'], ['T', '△', 't'], ['X', '×', 'x']].forEach(function (m) {

              q.onclick = function (ev) {
                if (ev && ev.stopPropagation) ev.stopPropagation();
                markHw(s, hwMark === m[0] ? '' : m[0]);
              };
              row.appendChild(q);
            });

      function paintBooks() {
        if (!bookSel) return;
        bookSel.innerHTML = '';

        ph.value = '';

        wrap: wrap, P: P, bookSel: bookSel,
        paintGrades: paintGrades, paintStudents: paintStudents, paintBooks: paintBooks,
        probeGrade: probeGrade,
        /* 다른 화면(새 탭)에서 특정 학생을 바로 고를 때 */
        selectStudent: function (s, bookId) {

          P.student = s;

          paintGrades(); paintStudents();
          if (opt.onStudent) opt.onStudent(s);

    function todayStr() { return S.today || today(); }

          W.saved = (r && r.pages) || {};
          W.marks = {}; W.att = {};
          Object.keys(W.saved).forEach(function (pg) {
            var s = W.saved[pg];
            var set = {};
            (s.nos || []).forEach(function (n) { set[String(n)] = true; });
            /* 같은 쪽 여러 행 → 저장된 번호를 각 행의 번호와 교집합해서 나눠 담는다 */
            W.pages.filter(function (p) { return p.page === pg; }).forEach(function (p) {
              var m = {};
              p.nos.forEach(function (n) { if (set[n]) m[n] = true; });
              W.marks[p.key] = m;
              W.att[p.key] = attLoad((s && s.att) || (s && s.guess === 'Y' ? '찍음' : ''));
              if (s && s.state === '확인필요') W.att[p.key].check = true;
            });
          });
          renderMatrix();
        }).catch(function (e) { if (seq === W.seq) wSay(e.message, true); });
    }
    function quickOf(page, no) {
      var q = W.quick[String(page)];
      if (!q) return '';
      var v = q[String(no)];
      /* Q1(2026-11-28): 구조는 '01', 정답은 '1' 처럼 적힌 경우를 모두 찾아 본다. */
      if ((v === undefined || v === null || v === '') && /^\d+$/.test(String(no))) {
        var n = String(parseInt(no, 10));
        if (Object.prototype.hasOwnProperty.call(q, n)) v = q[n];
      }
      return v == null ? '' : v;
    }
    function filtered() {
      var f = parseInt(W.from, 10), t = parseInt(W.to, 10);
      var sel = Object.keys(W.units || {});
      return W.pages.filter(function (p) {
        var n = parseInt(p.page, 10);
        if (!isNaN(f) && !isNaN(n) && n < f) return false;
        if (!isNaN(t) && !isNaN(n) && n > t) return false;
        if (sel.length && !W.units[p.unit]) return false;   /* 코너 다중 선택 필터 */
        if (W.hideDone && W.saved[p.page]) return false;
        return true;
      });
    }
    function renderMatrix() {
      mx.innerHTML = '';
      W.rowEls = {};
      if (!W.student) { mx.appendChild(el('div', 'wb-empty', '학년 → 학생 → 교재 순서로 눌러 주세요.')); return; }
      if (!W.book) { mx.appendChild(el('div', 'wb-empty', '교재를 골라 주세요.')); return; }
      if (!W.pages.length) {
        mx.appendChild(el('div', 'wb-empty',
          '이 교재의 페이지 정보가 아직 없습니다.\n학원 PC 콘솔에서 교재를 등록하면 자동으로 채워집니다.'));
        return;
      }
      var rows = filtered();
      if (!rows.length) {
        /* 2차(2026-11-28): [적용]을 눌렀는데 표가 사라진 것처럼 보이지 않도록 이유와 복구 버튼을 같이 보여 준다 */
        var selU = Object.keys(W.units || {});
        var box = el('div', 'wb-empty');
        var why = selU.length ? ('코너 필터 「' + selU.join(', ') + '」')
          : (W.hideDone ? '완료페이지 숨기기' : ('채점범위 ' + (W.from || '?') + '~' + (W.to || '?') + 'p'));
        box.appendChild(el('div', '', (selU.length || !W.hideDone)
          ? ('이 범위에 보일 페이지가 없습니다.\n(' + why + ' 때문에 0쪽입니다)')
          : '이 범위의 페이지는 모두 저장되었습니다.'));
        if (selU.length) {
          var bAll2 = btn('wb-btn2', '코너 전체로 보기');
          bAll2.style.marginTop = '10px';
          bAll2.onclick = function () { W.units = {}; buildCornerChips(); renderMatrix(); };
          box.appendChild(bAll2);
        }
        if (W.hideDone) {
          var bHide = btn('wb-btn2 ghost', '완료 숨기기 끄기');
          bHide.style.marginTop = '10px';
          bHide.onclick = function () { W.hideDone = false; if (hideChk) hideChk.checked = false; renderMatrix(); };
          box.appendChild(bHide);
        }
        mx.appendChild(box);
        return;
      }
      /* 2차: 같은 쪽이 여러 행(유형별)으로 나뉜 교재는 빠른정답을 그 쪽 첫 줄에만 한 번 보여 준다 */
      var firstOf = {}, merged = {};
      rows.forEach(function (p) {
        if (!firstOf[p.page]) firstOf[p.page] = p;
        merged[p.page] = (merged[p.page] || []).concat(p.nos || []);
      });
      Object.keys(merged).forEach(function (pg) {
        var seenN = {}, out = [];
        merged[pg].sort(noSort).forEach(function (n) { if (!seenN[n]) { seenN[n] = 1; out.push(n); } });
        merged[pg] = out;
      });

      var lastUnit = null;
      rows.forEach(function (p) {
        var unit = p.unit || '';
        if (unit && unit !== lastUnit) {
          mx.appendChild(el('div', 'wb-mu', shortUnit(unit)));
          lastUnit = unit;
        }
        mx.appendChild(quickCell(p, firstOf[p.page] === p ? merged[p.page] : null));
        mx.appendChild(pageRow(p));
      });
    }
    /* 코너 이름이 길면 괄호 설명을 떼어 한 줄에 담는다(원래 이름은 title 로 보여 준다) */
    function cornerLabel(u) {
      var s = String(u || '').trim();
      var m = /^(.*?)\s*\([^)]*\)\s*(\d+)?\s*$/.exec(s);
      if (m && m[1]) return m[1].trim() + (m[2] ? ' ' + m[2] : '');
      return s;
    }
    function shortUnit(u) {
      var s = cornerLabel(u);
      return s.length > 34 ? s.slice(0, 33) + '…' : s;
    }
    /* 빠른정답 페이지 번호 클릭 → 오른쪽 그 페이지 줄로 이동(가운데) + 잠깐 하이라이트 */
    function jumpToRow(page) {
      var tr = (W.rowEls && W.rowEls[page]) || document.getElementById('wbrow-' + page);
      if (!tr) return;
      tr.scrollIntoView({ behavior: 'smooth', block: 'center' });
      tr.classList.remove('flash');
      void tr.offsetWidth;            /* 같은 줄을 다시 눌러도 다시 표시되게 */
      tr.classList.add('flash');
      setTimeout(function () { tr.classList.remove('flash'); }, 1500);
    }
    function quickCell(p, nosArr) {
      if (nosArr === null) {
        /* 같은 쪽이 여러 행으로 나뉜 경우 — 두 번째 줄부터는 빠른정답을 다시 그리지 않는다 */
        var cont = el('div', 'wb-mq cont');
        cont.appendChild(el('span', '', '↳ ' + p.label + ' 같은 쪽 이어서 — 빠른 정답은 위에 있습니다'));
        return cont;
      }
      var line = el('div', 'wb-mq');
      var a = el('a', '', p.label);
      a.href = '#wbrow-' + String(p.key || p.page).replace(/#/g, '_');
      a.title = p.label + ' 문항 줄로 이동';
      a.onclick = function (ev) { ev.preventDefault(); jumpToRow(p.page); };
      line.appendChild(a);
      var box = el('div', 'wb-q-nos');
      (nosArr || p.nos).forEach(function (no) {
        var q = quickOf(p.page, no);
        /* 정답이 그림인 문항은 눌러서 그 그림을 볼 수 있게 버튼으로 만든다(ans-img.js). */
        var fig = !!(window.WINNERS_ANSIMG && WINNERS_ANSIMG.isFigure(q));
        var chip = el(fig ? 'button' : 'span', 'wb-q' + (q ? '' : ' none') + (fig ? ' img' : ''));
        if (fig) {
          chip.type = 'button';
          chip.title = p.label + ' ' + no + '번 정답 그림 보기';
          chip.onclick = (function (pg, num) {
            return function () { WINNERS_ANSIMG.open(W.book && W.book.bookId, pg, num, W.book && W.book.title); };
          })(p.page, no);
        }
        chip.appendChild(el('b', '', no));
        chip.appendChild(document.createTextNode(' ' + ansText(q)));
        box.appendChild(chip);
      });
      if (!(nosArr || p.nos).length) box.appendChild(el('span', 'wb-note', '문항 정보가 없습니다'));
      line.appendChild(box);
      return line;
    }
    function pageRow(p) {
      var tr = el('div', 'wb-mr');
      var domId = 'wbrow-' + String(p.key).replace(/#/g, '_');
      tr.id = domId;
      tr.setAttribute('data-page', p.page);
      if (!W.rowEls[p.page]) W.rowEls[p.page] = tr;
      var saved = W.saved[p.page];
      if (saved) tr.classList.add('done');

      var pg = el('div', 'wb-pg');
      pg.appendChild(document.createTextNode(p.label));
      if (saved) {
        var byStudent = /학생/.test(String(saved.src || ''));
        pg.appendChild(el('span', 'st' + (byStudent ? ' stu' : ''), byStudent ? '학생' : (saved.state === '확인필요' ? '확인' : '완료')));
      }
      tr.appendChild(pg);

      var list = el('div', 'wb-nos');
      var mark = W.marks[p.key] || (W.marks[p.key] = {});
      p.nos.forEach(function (n) {
        var on = !!mark[n];
        var b = el('button', 'wb-o' + (on ? ' on' : ''));
        b.type = 'button';
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
        b.appendChild(el('span', 'n', n));
        b.appendChild(el('span', 'c', on ? '✕' : '○'));
        b.onclick = function () {
          if (mark[n]) delete mark[n]; else mark[n] = true;
          var nowOn = !!mark[n];
          b.classList.toggle('on', nowOn);
          b.setAttribute('aria-pressed', nowOn ? 'true' : 'false');
          b.querySelector('.c').textContent = nowOn ? '✕' : '○';
          tr.classList.remove('done');
          updateScore();
          markDirty(p.key);
        };
        list.appendChild(b);
      });
      tr.appendChild(list);

      var attBox = el('div', 'wb-att');
      var att = W.att[p.key] || (W.att[p.key] = {});
      ATT.forEach(function (a) {
        var b = btn('' + (att[a[0]] ? 'on' : ''), a[1]);
        b.setAttribute('data-k', a[0]);
        b.onclick = function () {
          if (att[a[0]]) delete att[a[0]]; else att[a[0]] = true;
          b.classList.toggle('on', !!att[a[0]]);
          tr.classList.remove('done');
          markDirty(p.key);
        };
        attBox.appendChild(b);
      });
      tr.appendChild(attBox);

      var sc = el('div', 'wb-sc');
      tr.appendChild(sc);

      var sv = el('div', 'wb-sv');
      var saveBtn = btn('wb-save', saved ? (saved.state === '확인필요' ? '확인필요' : '저장됨') : '저장');
      if (saved) saveBtn.classList.add('ok');
      if (!p.nos.length) {
        /* 2026-11-28: 구조에 문항이 없는 쪽은 저장할 것이 없다 — 버튼을 막아 오저장을 막는다 */
        saveBtn.textContent = '문항없음';
        saveBtn.disabled = true;
        saveBtn.title = '이 쪽은 구조 시트에 문항 번호가 없습니다(교재 등록 확인 필요)';
      }
      saveBtn.onclick = function () { savePage(p, saveBtn); };
      sv.appendChild(saveBtn);
      tr.appendChild(sv);

      function updateScore() {
        var n = nosOf(mark).length;
        sc.textContent = (n ? n : '-') + '/' + p.nos.length;
        sc.classList.toggle('warn', n > 0);
      }
      updateScore();
      return tr;
    }

    /* 저장 직후 그 줄 배지를 바로 바꿔 준다: 완료 / 확인 (2026-11-26) */
    function markRowBadge(page, confirm) {
      var rows = mx.querySelectorAll('[data-page="' + String(page).replace(/"/g, '') + '"]');
      Array.prototype.forEach.call(rows, function (tr) {
        var pg = tr.querySelector('.wb-pg');
        if (!pg) return;
        var st = pg.querySelector('.st');
        if (!st) { st = el('span', 'st'); pg.appendChild(st); }
        st.textContent = confirm ? '확인' : '완료';
      });
    }
    /* 같은 쪽이 여러 행으로 나뉜 경우 — 그 쪽의 모든 행 번호를 합쳐서 저장한다(한 행 저장이 다른 행을 지우지 않게) */
    function pageRows(pg) {
      return W.pages.filter(function (x) { return x.page === pg; });
    }
    function pageNosUnion(pg) {
      var out = [];
      pageRows(pg).forEach(function (x) {
        nosOf(W.marks[x.key]).forEach(function (n) { if (out.indexOf(n) < 0) out.push(n); });
      });
      return out.sort(noSort);
    }
    function pageAttUnion(pg) {
      var o = {};
      pageRows(pg).forEach(function (x) {
        var a = W.att[x.key] || {};
        Object.keys(a).forEach(function (k) { if (a[k]) o[k] = k; });
      });
      return o;
    }
    /* 2026-11-28 ① 낙관적 UI: 누르면 바로 저장됨으로 보이고 서버 전송은 뒤에서 한다. 실패할 때만 경고·재시도 */
    function sendSave(body, retries) {
      return srv('w62WbSavePage', body).catch(function (e) {
        if (retries > 0) {
          return new Promise(function (res) { setTimeout(res, 900); })
            .then(function () { return srv('w62WbSavePage', body); });
        }
        throw e;
      });
    }
    function savePage(p, btnEl) {
      if (!W.student || !W.book) return;
      /* 2차(2026-11-28): 저장 연타로 같은 쪽이 두 번 기록되지 않게 줄별 잠금 */
      if (W.sending[p.key]) { wSay(p.label + ' 저장 중입니다… 잠시만 기다려 주세요.'); return; }
      var nos = pageNosUnion(p.page);
      var att = pageAttUnion(p.page);
      var attStr = attText(att);
      var confirm = !!att.check;
      var src = W.again ? '또답' : '숙제관리';
      var before = W.saved[p.page];
      W.saved[p.page] = { nos: nos, at: '', state: confirm ? '확인필요' : (nos.length ? '대기' : '페이지완료'),
                          att: attStr, src: src };
      pageRows(p.page).forEach(function (x) { delete W.dirty[x.key]; });
      updateBatch();
      markRowBadge(p.page, confirm);
      if (btnEl) { btnEl.textContent = '저장 중…'; btnEl.classList.add('ok'); btnEl.disabled = true; }
      wSay(p.label + ' 저장 중…');
      var body = {
        pin: pinArg(), admin: S.admin,
        studentId: W.student.id, studentName: W.student.name,
        bookId: W.book.bookId, bookTitle: W.book.title,
        page: p.page, nos: nos, attitude: attStr, state: '',
        hw: W.hw || '', und: W.perf, date: S.today,
        src: src, note: W.again ? '또답' : ''
      };
      var sid = W.student.id, bk = W.book;
      W.sending[p.key] = 1;
      /* 실패하면 서버가 이미 받았을 수 있어 자동 재전송하지 않는다(중복 저장 방지) — 선생님이 [다시] 로 보낸다. */
      sendSave(body, 0).then(function (r) {
        delete W.sending[p.key];
        if (btnEl) { btnEl.textContent = '저장됨'; btnEl.disabled = false; }
        if (W.saved[p.page]) W.saved[p.page].at = (r && r.at) || '';
        if (W.student && W.student.id !== sid) return;      /* 그 사이 다른 학생으로 바뀌었으면 화면만 그대로 */
        wSay(p.label + ' 저장 완료 · ' + (nos.length ? '오답 ' + nos.join(', ') + '번' : '오답 없음(완료)')
          + (attStr ? ' · 태도 ' + attStr : ''));
        var st = statOf(sid);
        if (st) { st.done = true; }
        else { STAT.bySid[sid] = { day: todayStr(), done: true, check: false, checkN: 0, top: [], again: [], pages: {} }; }
        if (confirm && st) { st.check = true; st.checkN = Math.max(st.checkN || 0, 1); }
        wPick.paintStudents();
        paintTop3();
        if (W.hideDone && !confirm) renderMatrix();
      }).catch(function (e) {
        delete W.sending[p.key];
        if (before !== undefined) W.saved[p.page] = before; else delete W.saved[p.page];
        pageRows(p.page).forEach(function (x) { W.dirty[x.key] = 1; });
        updateBatch();
        if (btnEl) { btnEl.textContent = '저장 실패 · 다시'; btnEl.classList.remove('ok'); btnEl.disabled = false; }
        wSay(p.label + ' 저장 실패: ' + ((e && e.message) || '연결 오류') + ' — 쪽의 [다시] 또는 [변경된 쪽 한 번에 저장]으로 보내 주세요.', true);
      });
    }

    /* ── 변경된 쪽 모아 저장 / 방금 틀린 것만 인쇄 / 인쇄 상태 폴링 ── */
    function markDirty(pg) { W.dirty[pg] = 1; updateBatch(); }
    function updateBatch() {
      var n = Object.keys(W.dirty).length;
      if (!bAll) return;
      bAll.textContent = n ? ('💾 변경된 쪽 한 번에 저장 (' + n + '쪽)') : '💾 변경된 쪽 한 번에 저장';
      bAll.disabled = !n || W.busy;
    }
    againChip.onclick = function () {
      W.again = !W.again;
      againChip.classList.toggle('on', W.again);
      wSay(W.again ? '또답 체크 켜짐 — 이제 저장하는 쪽은 출처가 「또답」으로 기록됩니다.'
                   : '또답 체크 꺼짐 — 보통 숙제 채점으로 기록됩니다.');
    };
    marginSel.onchange = function () {
      W.margin = marginSel.value === 'wide' ? 'wide' : 'normal';
      store('wmath_wb_margin_v1', W.margin);
    };
    function pagesExprOf(pages) {
      var nums = (pages || []).map(function (x) { return parseInt(x, 10); })
        .filter(function (n) { return !isNaN(n); }).sort(function (a, b) { return a - b; });
      if (!nums.length) return '';
      if (nums.length === 1) return String(nums[0]);
      var cont = true;
      for (var i = 1; i < nums.length; i++) if (nums[i] !== nums[i - 1] + 1) { cont = false; break; }
      return cont ? (nums[0] + '-' + nums[nums.length - 1]) : nums.join(',');
    }
    function saveAll() {
      var keys = Object.keys(W.dirty);
      if (!keys.length) { wSay('변경된 쪽이 없습니다.'); return Promise.resolve(0); }
      if (!W.student || !W.book) { wSay('학생과 교재를 먼저 골라 주세요.', true); return Promise.resolve(0); }
      W.busy = true; if (bAll) { bAll.disabled = true; bAll.textContent = '저장 중…'; }
      var sid = W.student.id;
      /* rowKey → 쪽 번호로 묶어서 한 쪽당 한 번만 보낸다(같은 쪽 다중 행 대비) */
      var touched = [];
      keys.forEach(function (k) {
        var p = W.pages.filter(function (x) { return x.key === k; })[0];
        if (p && touched.indexOf(p.page) < 0) touched.push(p.page);
      });
      var items = touched.map(function (pg) {
        var att = pageAttUnion(pg);
        return { page: pg, nos: pageNosUnion(pg), attitude: attText(att), state: '',
                 hw: W.hw || '', und: W.perf, src: W.again ? '또답' : '숙제관리',
                 note: W.again ? '또답' : '' };
      });
      if (bAll) bAll.textContent = '저장 중… (' + items.length + '쪽)';
      /* ③ 서버에서 한 번의 잠금·한 번의 쓰기로 처리(쪽마다 왕복하던 시간 제거) */
      return srv('w62WbSavePagesBatch', {
        pin: pinArg(), admin: S.admin,
        studentId: W.student.id, studentName: W.student.name,
        bookId: W.book.bookId, bookTitle: W.book.title,
        pages: items, date: S.today
      }).then(function (r) {
        (r.saved || []).forEach(function (s) {
          var it = items.filter(function (x) { return x.page === s.page; })[0] || {};
          W.saved[s.page] = { nos: it.nos || [], at: r.at || '', state: s.state || '',
                              att: it.attitude || '', src: it.src };
          pageRows(s.page).forEach(function (x) { delete W.dirty[x.key]; });
        });
        W.busy = false; updateBatch();
        var st = statOf(sid);
        if (st) { st.done = true; }
        else { STAT.bySid[sid] = { day: todayStr(), done: true, check: false, checkN: 0, top: [], again: [], pages: {} }; }
        wPick.paintStudents();
        paintTop3();
        renderMatrix();
        var nSaved = (r && typeof r.count === 'number' && r.count > 0) ? r.count
          : ((r && r.saved && r.saved.length) || items.length);
        wSay(nSaved + '쪽 저장 완료' + (W.again ? ' · 🔥 또답으로 기록' : ''));
        return nSaved;
      }).catch(function (e) {

        srv('w62WbPrintList', { pin: pinArg(), admin: S.admin }).then(function (r) {
          var rows = (r && r.rows) || [];

          if (!mine.length) { return; }
          var st = mine.map(function (x) { return String(x.state || '').toLowerCase(); });
          var label = st.every(function (x) { return x === 'done'; }) ? '완료'

              : st.some(function (x) { return x === 'processing' || x === 'printing'; }) ? '인쇄 중'
                : '대기';
          printState.textContent = '🖨 인쇄 상태: ' + label + ' (' + mine.length + '건)';
          printState.className = 'wb-pstate ' + (label === '완료' ? 'ok' : (label === '오류' ? 'err' : 'wait'));
          if (label === '완료' || label === '오류' || Date.now() > stopAt) {

    function rSelected() {

          if (R.only === 'again' && !/또답/.test(String(pg.src || ''))) return;
          pg.nos.forEach(function (no) {

            pages[pg.page].push(no);

      if (!nums.length) return '';
      var cont = true;
      for (var i = 1; i < nums.length; i++) if (nums[i] !== nums[i - 1] + 1) { cont = false; break; }
      if (nums.length === 1) return String(nums[0]);
      return cont ? (nums[0] + '-' + nums[nums.length - 1]) : nums.join(',');

    /* '8-9' / '65,80' 같은 쪽수 문자열 → {8:1,9:1} */
    function pageSetOf(expr) {
      var s = String(expr || '').replace(/^'/, '').replace(/\s+/g, '');
      if (!s) return null;
      var out = {};
      s.split(',').forEach(function (part) {
        var m = /^(\d+)-(\d+)$/.exec(part);
        if (m) { for (var i = parseInt(m[1], 10); i <= parseInt(m[2], 10); i++) out[String(i)] = 1; }
        else if (/^\d+$/.test(part)) out[String(parseInt(part, 10))] = 1;
      });
      return Object.keys(out).length ? out : null;
    }

                   'math-wrong.html?mode=one&sid=' + encodeURIComponent(s.id) + '&name=' + encodeURIComponent(s.name || '')
                   + (bk ? '&book=' + encodeURIComponent(bk) : ''));
            /* 이 학생 상태(오늘 완료·확인필요)를 명단보다 먼저 받아 ON다 */
            loadStat(s.id).then(function () { try { wPick.paintStudents(); paintTop3(); } catch (e) { } });
            if (!bk) wSay(s.name + ' 학생 — 교재를 고르면 채점 표가 나옵니다. (탭 이름 = ' + s.name + ')');
            return;
          }
          waited += 300;
          if (tries-- > 0) {
            if (waited % 3000 === 0) wSay((nm || '학생') + ' 명단 불러오는 중… (' + Math.round(waited / 1000) + '초)');
            setTimeout(pick, 300);
          } else {
            wSay('학생 명단을 불러오지 못했습니다. 선생님 화면에서 핀을 다시 넣고 열어 주세요.', true);
          }
        })();
      })();
    }
  }

  global.WB = { mount: mount };
})(typeof window !== 'undefined' ? window : this);

WB.mount(document.getElementById('wbRoot'), {});
</script>
