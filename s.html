<!doctype html><html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WINNERS — 내 오답 입력</title>
<script>window.WINNERS_BRIDGE={mode:"gas",exec:"https://script.google.com/macros/s/AKfycbymRr0dMKGbCob4w9LyNR08N2RbmfyK4xxXrgt2SgcZan9daWbro64jG_NP3GVvpRK3sg/exec"};</script>
<script src="bridge.js?v=7"></script>
<style>
  :root{--navy:#15345d;--ink:#1b3b60;--sub:#6e87a2;--line:#dbe7f5;--bg:#f4f8fe;--teal:#2f9d8f;--blue:#1a70d6}
  *{box-sizing:border-box;-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);padding:22px 14px 40px;
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif}
  .wrap{max-width:520px;margin:0 auto}
  .card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px 18px;margin-bottom:14px;
    box-shadow:0 8px 26px rgba(21,52,93,.07)}
  .brand{font-size:13px;font-weight:900;color:var(--blue);letter-spacing:.02em}
  h1{font-size:20px;margin:6px 0 4px;color:var(--navy);letter-spacing:-.02em}
  .sub{font-size:13px;color:var(--sub);line-height:1.55;margin:0}
  .who{display:block;margin-top:14px;padding:13px 16px;border-radius:15px;background:#e8f5f3;
    border:1px solid #bfe0da;color:#1d7d70;font-size:22px;font-weight:900;text-align:center;letter-spacing:-.02em}
  .who small{display:block;font-size:12.5px;font-weight:800;color:#2b7658;margin-top:3px}
  .btn{display:flex;align-items:center;gap:12px;width:100%;min-height:92px;border-radius:20px;border:0;
    background:#1a70d6;color:#fff;font-size:20px;font-weight:900;padding:16px 20px;margin-top:14px;
    text-decoration:none;box-shadow:0 8px 20px rgba(26,112,214,.22)}
  .btn.eng{background:#2f9d8f;box-shadow:0 8px 20px rgba(47,157,143,.22)}
  .btn .ico{font-size:30px;line-height:1}
  .btn .tx{display:flex;flex-direction:column;gap:3px;text-align:left}
  .btn .tx small{font-size:12.5px;font-weight:700;opacity:.9}
  .btn[aria-disabled=true]{opacity:.45;pointer-events:none;box-shadow:none}
  .msg{font-size:14px;line-height:1.65;color:#c2410c;font-weight:700}
  .foot{font-size:12px;color:#8298ad;text-align:center;line-height:1.7;margin-top:18px}
  .hide{display:none!important}
  @media (max-width:360px){.who{font-size:19px}.btn{min-height:84px;font-size:18px}}
</style>
</head><body>
<div class="wrap">
  <div class="card">
    <div class="brand">WINNERS 해법영수학원</div>
    <h1>내 오답 입력</h1>
    <p class="sub">아래 버튼을 누르면 내 이름으로 바로 열립니다. 교재를 고르고 틀린 문제 번호만 누르면 돼요.</p>
    <div id="who" class="who">불러오는 중…</div>
  </div>

  <div id="go" class="hide">
    <a id="btnMath" class="btn"><span class="ico">📐</span><span class="tx">수학 오답 입력<small>틀린 문제 번호 O/X</small></span></a>
    <a id="btnEng" class="btn eng"><span class="ico">📘</span><span class="tx">영어 오답 입력<small>틀린 문제 번호 O/X</small></span></a>
    <p id="engNote" class="sub hide" style="margin-top:10px">영어는 영어 수강생만 쓸 수 있어요. 수학 오답은 위 버튼으로 입력해 주세요.</p>
  </div>

  <div id="err" class="card hide"><p class="msg" id="errMsg"></p></div>

  <p class="foot">저장한 오답은 선생님 화면에 바로 보입니다.<br>QR이 열리지 않으면 선생님께 다시 받아 주세요.</p>
</div>

<script>
(function () {
  'use strict';
  function qp(n) {
    var m = new RegExp('[?&]' + n + '=([^&]+)').exec(String(location.search || ''));
    return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
  }
  var ID = qp('id') || qp('sid');
  var K = qp('k');
  /* 영어 화면(위너스_영어점수_전용) 주소 — 영어 수강생인지 확인할 때만 쓴다. */
  var ENG_EXEC = 'https://script.google.com/macros/s/AKfycbwQDZu4RIj8S8whycUx3f2lR6NSQaAW1XLHfIHp3Od6GIXEC7MLvP7jn5zS03Tq1Q-UaQ/exec';
  var who = document.getElementById('who');
  var go = document.getElementById('go');
  var err = document.getElementById('err');
  var errMsg = document.getElementById('errMsg');

  function fail(msg) {
    who.textContent = '열 수 없습니다';
    errMsg.textContent = msg;
    err.classList.remove('hide');
  }

  if (!ID || !K) {
    fail('QR 주소가 아닙니다. 선생님께 받은 QR을 다시 찍어 주세요.');
    return;
  }

  function info(fn) {
    return new Promise(function (res, rej) {
      if (!(window.WINNERS_BRIDGE && WINNERS_BRIDGE.call)) { rej(new Error('서버 연결이 없습니다.')); return; }
      WINNERS_BRIDGE.call(fn, [{ sid: ID, k: K }]).then(function (r) {
        if (r && r.ok === false) { rej(new Error(r.error || '서버 오류')); return; }
        res(r || {});
      }, function (e) { rej(new Error((e && e.message) || String(e))); });
    });
  }

  info('w62StInfo').then(function (r) {
    var s = r.student || {};
    var name = s.name || '';
    var grade = s.grade || '';
    who.innerHTML = '';
    who.appendChild(document.createTextNode((name || '내') + ' 학생'));
    var sm = document.createElement('small');
    sm.textContent = grade ? grade + ' · 오늘도 화이팅!' : '오늘도 화이팅!';
    who.appendChild(sm);
    document.title = (name || '학생') + ' — 오답 입력';

    var q = '&sid=' + encodeURIComponent(ID) + '&k=' + encodeURIComponent(K)
          + (name ? '&name=' + encodeURIComponent(name) : '')
          + (grade ? '&grade=' + encodeURIComponent(grade) : '');
    document.getElementById('btnMath').href = 'math-wrong.html?mode=student' + q;
    /* 영어도 수학과 같은 github.io 화면으로 바로 연다.
       (예전에는 GAS 콘솔 주소로 보냈는데, 구글 드라이브 오류 화면에 막혔다.) */
    document.getElementById('btnEng').href = 'english-console.html?mode=student' + q;
    go.classList.remove('hide');
    checkEnglish();
  }).catch(function (e) {
    fail(e.message || 'QR을 확인하지 못했습니다.');
  });

  /* 2026-11-27: 영어 수강생 명단에 없는 학생이 영어 화면으로 들어가 저장하면
     교사 화면 어디에도 안 보이는 고아 기록이 된다. 명단 밖이면 버튼을 숨긴다.
     (명단을 못 받아 왔을 때는 버튼을 그대로 두고, 영어 화면 쪽에서도 한 번 더 막는다.) */
  function checkEnglish() {
    if (typeof fetch !== 'function') return;
    fetch(ENG_EXEC, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ bridge: 1, fn: 'waeWbRoster', args: [{}] }),
      redirect: 'follow',
      cache: 'no-store'
    }).then(function (r) { return r.text(); }).then(function (t) {
      var j;
      try { j = JSON.parse(t); } catch (e) { return; }
      var list = (j && j.students) || [];
      if (!list.length) return;
      var mine = list.some(function (s) { return String((s && s.id) || '') === String(ID); });
      if (mine) return;
      var btn = document.getElementById('btnEng');
      if (btn) btn.classList.add('hide');
      var note = document.getElementById('engNote');
      if (note) note.classList.remove('hide');
    }).catch(function () { });
  }
})();
</script>
</body></html>
